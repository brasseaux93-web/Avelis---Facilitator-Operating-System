version: '3.8'

# Local / staging topology: postgres + api + room.
# Room is memory-only - no volume for room state.
# Secrets MUST come from a local env file (see .env.compose.example). Never commit real secrets.
# Ports bound to loopback only - do not expose the seeded API beyond localhost.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: avelis
      POSTGRES_PASSWORD: avelis
      POSTGRES_DB: avelis
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avelis -d avelis"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://avelis:avelis@postgres:5432/avelis
      API_PORT: "3001"
      JWT_SECRET: ${JWT_SECRET:?required}
      ROOM_SHARED_SECRET: ${ROOM_SHARED_SECRET:?required}
      ROOM_CONTROL_HOST: room
      ROOM_CONTROL_PORT: "3003"
      KMS_PROVIDER: local
      LOCAL_DEV_SIGNING_KEY: ${LOCAL_DEV_SIGNING_KEY:?required}
      LOCAL_DEV_ENCRYPTION_KEY: ${LOCAL_DEV_ENCRYPTION_KEY:?required}
      ENABLE_PUBLIC_REGISTER: "true"
      RETENTION_JOB_INTERVAL_MINUTES: "15"
      SECURITY_AUDIT_RETENTION_HOURS: "720"
      TRUST_PROXY: "true"
      LOG_REQUEST_BODIES: "false"
      LOG_WEBSOCKET_PAYLOADS: "false"
      SESSION_REPLAY_ENABLED: "false"
      PRODUCT_ANALYTICS_ENABLED: "false"
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      room:
        condition: service_started

  room:
    build:
      context: .
      dockerfile: Dockerfile.room
    environment:
      NODE_ENV: development
      ROOM_PORT: "3002"
      ROOM_CONTROL_PORT: "3003"
      ROOM_CONTROL_BIND: "0.0.0.0"
      ROOM_SHARED_SECRET: ${ROOM_SHARED_SECRET:?required}
      LOG_WEBSOCKET_PAYLOADS: "false"
    ports:
      - "127.0.0.1:3002:3002"
    mem_limit: 512m

volumes:
  postgres_data:
