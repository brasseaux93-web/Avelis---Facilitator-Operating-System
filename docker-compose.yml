version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: avelis_admin
      POSTGRES_PASSWORD: avelis_password
      POSTGRES_DB: avelis_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avelis_admin -d avelis_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
