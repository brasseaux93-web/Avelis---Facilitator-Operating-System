<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1750 650" width="100%" height="100%">
  <!-- Background: Matte dark obsidian canvas -->
  <rect width="100%" height="100%" fill="#111110" />

  <!-- ==========================================
       AVELIS INSTITUTIONAL LOCKUP (DARK UI)
       - Emblem & Divider: Ledger Gold (#CF9E42)
       - Typography: Archival Off-White (#F6F3EC)
       ========================================== -->

  <!-- Emblem Geometry (Left) -->
  <!-- Strict 90-degree orthogonal drafting, uniform 24px stroke weights -->
  <g transform="translate(100, 100)">
    <!-- Left Ledger Margin Rule -->
    <line x1="12" y1="0" x2="12" y2="280" stroke="#CF9E42" stroke-width="24" stroke-linecap="square" />
    
    <!-- Right Ledger Margin Rule -->
    <line x1="208" y1="0" x2="208" y2="280" stroke="#CF9E42" stroke-width="24" stroke-linecap="square" />
    
    <!-- Unsealed Safe-Harbor Chamber (Centered with bottom threshold opening) -->
    <!-- Cap-height of chamber is exactly matching text: y=60 to y=240 (with stroke, 48 to 252) -->
    <path d="
      M 80,240
      L 58,240
      L 58,60
      L 162,60
      L 162,240
      L 140,240
    " fill="none" stroke="#CF9E42" stroke-width="24" stroke-linecap="square" stroke-linejoin="miter"/>
  </g>

  <!-- Typographic Stack (Right) -->
  <g transform="translate(380, 0)">
    <!-- Primary Wordmark -->
    <!-- Cap-height exactly matches the emblem chamber height (204px) -->
    <text 
      x="0" 
      y="352" 
      font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
      font-size="285" 
      font-weight="800" 
      letter-spacing="0.08em" 
      fill="#F6F3EC">AVELIS</text>

    <!-- Horizontal Divider Rule (Spanning full text block width) -->
    <line 
      x1="0" 
      y1="410" 
      x2="1270" 
      y2="410" 
      stroke="#CF9E42" 
      stroke-width="5" 
      stroke-linecap="square" />

    <!-- Attestation Slogan Line 1 -->
    <!-- Sized at ~25% of primary wordmark cap-height -->
    <text 
      x="0" 
      y="490" 
      font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
      font-size="72" 
      font-weight="500" 
      letter-spacing="0.22em" 
      fill="#F6F3EC">THE RECORD STANDS.</text>

    <!-- Attestation Slogan Line 2 -->
    <text 
      x="0" 
      y="580" 
      font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
      font-size="72" 
      font-weight="500" 
      letter-spacing="0.22em" 
      fill="#F6F3EC">THE ROOM IS CLEARED.</text>
  </g>
</svg>
