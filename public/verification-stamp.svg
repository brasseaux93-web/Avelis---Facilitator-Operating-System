<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 210" width="100%" height="100%">
  <!-- ==========================================
       AVELIS VERIFICATION STAMP (CONTAINED)
       - All elements strictly enclosed between dashed rails
       - Transparent background
       - Palette: Ledger Gold (#CF9E42)
       ========================================== -->

  <!-- Outer Horizontal Ledger Dashed Rails -->
  <line x1="20" y1="20" x2="520" y2="20" stroke="#CF9E42" stroke-width="2.5" stroke-dasharray="7 5" opacity="0.85" />
  <line x1="20" y1="190" x2="520" y2="190" stroke="#CF9E42" stroke-width="2.5" stroke-dasharray="7 5" opacity="0.85" />

  <!-- Standalone Avelis Emblem -->
  <g transform="translate(38, 35)">
    <!-- Flanking Ledger Margin Rules -->
    <rect x="0" y="0" width="16" height="140" fill="#CF9E42" />
    <rect x="110" y="0" width="16" height="140" fill="#CF9E42" />

    <!-- Unsealed Chamber with Bottom Threshold -->
    <path d="
      M 54,122 
      L 34,122 
      L 34,22 
      L 92,22 
      L 92,122 
      L 72,122
    " fill="none" stroke="#CF9E42" stroke-width="10" stroke-linecap="square" stroke-linejoin="miter" />
  </g>

  <!-- Typography Block (Strictly Balanced & Contained) -->
  <g fill="#CF9E42" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <!-- Primary Identifier -->
    <text 
      x="195" 
      y="105" 
      font-size="64" 
      font-weight="700" 
      letter-spacing="0.16em">AVELIS</text>

    <!-- Subordinate Attestation Status -->
    <text 
      x="197" 
      y="155" 
      font-size="34" 
      font-weight="600" 
      letter-spacing="0.28em" 
      opacity="0.95">VERIFIED</text>
  </g>
</svg>

